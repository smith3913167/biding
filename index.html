<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>입찰 전략 시뮬레이터</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
      background-color: #f4f4f4;
    }
    h2, h3 {
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    .highlight {
      background-color: #ffeb3b !important;
    }
    input, select {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      display: block;
      width: 220px;
    }
    .button-container {
      display: inline-block;
      border: 2px solid black;
      padding: 10px;
      background-color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    .button-container:hover {
      background-color: #ddd;
    }
  </style>
</head>
<body>
  <h2>입찰 전략 시뮬레이터</h2>
  <label>기초예비가격 (원):</label>
  <input type="text" id="basePrice" oninput="formatInput(this)" placeholder="예: 50,476,764" />

  <label>낙찰하한율 (%):</label>
  <select id="minBidRate">
    <option value="">-- 선택하세요 --</option>
    <option value="82.995">82.995%</option>
    <option value="87.995">87.995%</option>
    <option value="88.000">88.000%</option>
  </select>

  <div class="button-container" onclick="calculateBidStrategy()">계산하기</div>

  <h3>추천 입찰가 목록</h3>
  <table>
    <thead>
      <tr>
        <th>번호</th>
        <th>선택된 복수예비가격</th>
        <th>예비가격 평균</th>
        <th>최종 입찰가격</th>
        <th>투찰율 (%)</th>
        <th>낙찰 확률 예측 (%)</th>
      </tr>
    </thead>
    <tbody id="bidResults"></tbody>
  </table>

  <script>
    function formatInput(input) {
      input.value = input.value.replace(/[^0-9]/g, "");
      if (input.value) {
        input.value = parseInt(input.value).toLocaleString("ko-KR");
      }
    }

    function calculateBidStrategy() {
      const basePriceInput = document.getElementById("basePrice").value.replace(/,/g, "");
      const bidRateInput = document.getElementById("minBidRate").value;

      if (!basePriceInput || !bidRateInput) {
        alert("기초예비가격과 낙찰하한율을 입력해주세요.");
        return;
      }

      const basePrice = parseFloat(basePriceInput);
      const minBidRate = parseFloat(bidRateInput) / 100;
      let optimalBidRate;

      if (minBidRate === 0.82995) optimalBidRate = 0.8301; // 보정값 적용
      else if (minBidRate === 0.87995) optimalBidRate = 0.86;
      else if (minBidRate === 0.88) optimalBidRate = 0.865;
      else optimalBidRate = minBidRate;

      const prelimPrices = Array.from({ length: 15 }, () => (basePrice * (0.98 + 0.04 * Math.random())).toFixed(2));
      const bidResults = [];

      for (let i = 0; i < 20; i++) {
        const selected = Array.from({ length: 4 }, () => prelimPrices[Math.floor(Math.random() * 15)]);
        const average = selected.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / 4;
        const bidPrice = (average * optimalBidRate).toFixed(2);
        const bidRate = ((bidPrice / basePrice) * 100).toFixed(3);

        const threshold = average * minBidRate;
        const diff = Math.abs(parseFloat(bidPrice) - threshold);
        const score = Math.max(0, Math.exp(-diff * 0.005) * 100).toFixed(1); // 가우시안 기반 예측 모델 반영

        bidResults.push({
          index: i + 1,
          selected,
          average: average.toFixed(2),
          bidPrice,
          bidRate,
          score
        });
      }

      bidResults.sort((a, b) => b.score - a.score || a.bidPrice - b.bidPrice);

      const tbody = document.getElementById("bidResults");
      tbody.innerHTML = "";
      bidResults.forEach((row, i) => {
        const tr = document.createElement("tr");
        if (i === 0) tr.classList.add("highlight");

        tr.innerHTML = `
          <td>${row.index}</td>
          <td>${row.selected.map((v, i) => `⓵⓶⓷⓸`[i] + " " + parseFloat(v).toLocaleString("ko-KR") + " 원").join("<br>")}</td>
          <td>${parseFloat(row.average).toLocaleString("ko-KR")} 원</td>
          <td>${parseFloat(row.bidPrice).toLocaleString("ko-KR")} 원</td>
          <td>${row.bidRate}%</td>
          <td>${row.score}%</td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
